name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester + PSScriptAnalyzer
        shell: pwsh
        run: ./tests/ci.ps1
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # always the latest stable Go (operator preference); the go directive in go.mod is the language floor
          cache: false
      - name: vet + test
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          # the release builds these; catch a platform break in the PR, not at the tag
          for t in windows/amd64 linux/arm64 linux/amd64; do GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null .; done
  windows:
    name: Windows server runtime tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Vet on Windows
        working-directory: server
        run: go vet ./...
      - name: Test on Windows
        working-directory: server
        run: go test ./...
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # always the latest stable Go (operator preference); the go directive in go.mod is the language floor
          cache: false
      - name: Playwright UX check
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          cd server && go build -o /tmp/m2w . && cd ..
          /tmp/m2w -listen 127.0.0.1:18080 -manifests tests/ui/profiles -data "" -image-base https://boot.lab.internal/windows11 &
          for _ in $(seq 50); do curl -sf http://127.0.0.1:18080/api/state >/dev/null && break; sleep 0.1; done
          mkdir -p shots && python tests/ui/test_ui.py http://127.0.0.1:18080 shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots/
  scripts:
    name: Workflow lint and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (workflow syntax, expressions, shellcheck on run blocks)
        run: docker run --rm -v "$PWD":/repo -w /repo docker.io/rhysd/actionlint:latest -color
      - name: GitHub setup script, against a fake gh
        run: tests/setup-signing-github.test.sh
      - name: Boot-file staging (IPv6 bases, refused bases leave earlier output alone)
        run: tests/stage.test.sh
      - name: Release workflow shell steps, against a mock gh
        run: |
          pip install pyyaml
          python3 tests/release_workflow_test.py
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # always the latest stable Go (operator preference); the go directive in go.mod is the language floor
          cache: false
      - name: Build the AppImage
        run: |
          set -euo pipefail
          sudo apt-get install -y squashfs-tools
          (cd server && CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../minute2win-server .)
          tools/appimage.sh "$(cat VERSION)" minute2win-server "out/minute2win-server-$(cat VERSION)-x86_64.AppImage"
      # Runs without FUSE (hosted runners have none) by extracting itself; the image content is the same.
      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          img="$GITHUB_WORKSPACE/out/minute2win-server-$(cat VERSION)-x86_64.AppImage"
          cd "$(mktemp -d)"
          "$img" -listen 127.0.0.1:18081 -data "" &
          pid=$!
          for _ in $(seq 50); do curl -sf http://127.0.0.1:18081/api/state >/dev/null && break; sleep 0.1; done
          curl -sf http://127.0.0.1:18081/api/state >/dev/null
          curl -s http://127.0.0.1:18081/boot/aa:bb:cc:dd:ee:ff | grep -q '^exit 1$'   # an unarmed MAC boots its disk
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: out/*.AppImage
          if-no-files-found: error
