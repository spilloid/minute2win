name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester + PSScriptAnalyzer
        shell: pwsh
        run: ./tests/ci.ps1
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # always the latest stable Go (operator preference); the go directive in go.mod is the language floor
          cache: false
      - name: vet + test
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          # the release builds these; catch a platform break in the PR, not at the tag
          for t in windows/amd64 linux/arm64 linux/amd64; do GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null .; done
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # always the latest stable Go (operator preference); the go directive in go.mod is the language floor
          cache: false
      - name: Playwright UX check
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          cd server && go build -o /tmp/m2w . && cd ..
          /tmp/m2w -listen 127.0.0.1:18080 -manifests manifests -data "" &
          for i in $(seq 50); do curl -sf http://127.0.0.1:18080/api/state >/dev/null && break; sleep 0.1; done
          mkdir -p shots && python tests/ui/test_ui.py http://127.0.0.1:18080 shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots/
