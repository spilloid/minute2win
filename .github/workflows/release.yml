name: release
# On a v* tag (or a manual run for an existing tag): build everything, sign the Windows server with Azure Artifact Signing, verify
# the signature, and only then attach all assets to the release. If signing is not configured or fails, NOTHING is attached:
# a release is never published unsigned. No key, PFX or password exists anywhere; the sign job authenticates with a GitHub
# OIDC federated credential (STD-006). Setup: docs/RELEASING.md ("CI signing").
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)build assets for
        required: true

permissions:
  contents: read

# One release run per tag at a time: two runs must never interleave their uploads.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (Linux and unsigned Windows server, boot files)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      # The tag is attacker-influenced text (the manual input), so it never reaches a shell as source: it comes in through env,
      # must match a strict version pattern, and only then becomes an output.
      - id: meta
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: refusing" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # refs/tags/ explicitly: actions/checkout otherwise prefers a BRANCH of the same name, which would let a pushed branch called
      # v0.1.0 stand in for the tag and run its own scripts inside the signing job.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0
      # A release is built only from code that is on main (reviewed, merged). A tag on any other commit is refused, and the
      # resolved commit is pinned for every later job.
      - name: Tag must point at a commit on main; pin it
        id: pin
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "the tag's commit is not on main: refusing to build or sign it" >&2; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # always the latest stable Go (operator preference); the go directive in go.mod is the language floor
          cache: false
      - name: Check the tag against VERSION
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: test "v$(cat VERSION)" = "$TAG"
      - name: Build
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          V="${TAG#v}"; mkdir -p out stage-win/minute2win-server
          for arch in amd64 arm64; do
            d="minute2win-server-$V-linux-$arch"; mkdir -p "$d"
            (cd server && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "../$d/minute2win-server" .)
            cp -r manifests LICENSE THIRD_PARTY_NOTICES.md "$d/"
            tar czf "out/$d.tar.gz" "$d"
          done
          tools/appimage.sh "$V" "minute2win-server-$V-linux-amd64/minute2win-server" "out/minute2win-server-$V-x86_64.AppImage"
          # The Windows server goes to the signing job unsigned; it is zipped only after it is signed.
          (cd server && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../stage-win/minute2win-server/minute2win-server.exe" .)
          cp -r manifests LICENSE THIRD_PARTY_NOTICES.md stage-win/minute2win-server/
          tools/stage.sh stage
          (cd stage && zip -qr "../out/minute2win-$V-bootfiles.zip" windows11)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-boot-assets
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: stage-win/
          if-no-files-found: error

  sign:
    name: Sign and verify the Windows server
    needs: build
    runs-on: windows-latest
    # The OIDC subject for a job in an environment is fixed by the environment whether it runs for a tag or a manual dispatch,
    # so one federated credential covers both (scripts/setup-signing-azure.ps1).
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      # The exact commit the build job validated (on main), not a ref that could have moved or been shadowed since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      # Fail before signing anything, and never fall back to an unsigned release.
      - name: Check signing configuration
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          SIGNING_EXPECTED_SUBJECT: ${{ vars.SIGNING_EXPECTED_SUBJECT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $missing = @('SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'SIGNING_EXPECTED_SUBJECT',
                       'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Code signing is not configured; missing: $($missing -join ', '). Set them under Settings > Environments > release (docs/RELEASING.md, CI signing). Releases are never published unsigned."
          }
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-windows
          path: stage-win
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the Windows server
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\stage-win\minute2win-server
          files-folder-filter: exe
          file-digest: SHA256
          # Signing certificates last three days; without the countersignature the release stops verifying.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify the signature and timestamp
        shell: pwsh
        env:
          SIGNING_EXPECTED_SUBJECT: ${{ vars.SIGNING_EXPECTED_SUBJECT }}
        run: ./scripts/verify-signature.ps1 -Files stage-win/minute2win-server/minute2win-server.exe -ExpectedSubject $env:SIGNING_EXPECTED_SUBJECT
      - name: Zip, record signatures
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v'); New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path stage-win/minute2win-server -DestinationPath "out/minute2win-server-$v-windows-x64.zip"
          $sig = Get-AuthenticodeSignature stage-win/minute2win-server/minute2win-server.exe
          "file  status  signer" | Set-Content out/SIGNATURES.txt
          "minute2win-server.exe  $($sig.Status)  $($sig.SignerCertificate.Subject)" | Add-Content out/SIGNATURES.txt
          if ($sig.Status -ne 'Valid') { throw "Windows does not consider the signed executable Valid: $($sig.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: out/
          if-no-files-found: error

  # Attaches everything together, only after every file is signed and verified. A failure above attaches nothing.
  publish:
    name: Attach assets to the release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-and-boot-assets
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows
          path: assets
      # Only the expected assets can ever be attached: an unexpected file in any artifact fails the run instead of shipping.
      - name: Allowlist the asset set
        working-directory: assets
        run: |
          set -euo pipefail
          V="${TAG#v}"
          expected="SIGNATURES.txt
          minute2win-$V-bootfiles.zip
          minute2win-server-$V-linux-amd64.tar.gz
          minute2win-server-$V-linux-arm64.tar.gz
          minute2win-server-$V-x86_64.AppImage
          minute2win-server-$V-windows-x64.zip"
          expected="$(printf '%s\n' "${expected//  /}" | sort)"
          actual="$(find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          [ "$expected" = "$actual" ] || { printf 'unexpected asset set.\nexpected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2; exit 1; }
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      # Assets are only ever (re)written while the release is a DRAFT, and the draft's whole asset set is replaced, so a rerun can
      # never leave a published release half-updated or mixed with leftovers. Publishing stays a deliberate, manual step.
      - name: Upload to a draft release
        working-directory: assets
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "true" ] \
              || { echo "release $TAG is already published; refusing to modify it. Cut a new patch version." >&2; exit 1; }
            # A plain assignment, so a failed listing stops the run (set -e does not see a failure inside `for x in $(...)`).
            old="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
            while IFS= read -r a; do
              [ -n "$a" ] || continue
              gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" --yes
            done <<<"$old"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "minute2win ${TAG#v}" --notes "Draft: notes to follow."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" ./*
